name: Docker Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Remove leading 'v' if present
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Write version file
        run: |
          printf '%s\n' "${{ steps.version.outputs.version }}" > app/VERSION

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
        run: |
          set -euo pipefail

          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            CHANGE_TITLE="Changes since ${PREV_TAG}"
          else
            RANGE="HEAD"
            CHANGE_TITLE="Changes"
          fi

          COMMITS="$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE || true)"
          if [ -z "$COMMITS" ]; then
            COMMITS="- No commits found"
          fi

          PACKAGE_NAME="${IMAGE_NAME#*/}"
          SCOPE="users"
          if [ "${OWNER_TYPE}" = "Organization" ]; then
            SCOPE="orgs"
          fi

          DOWNLOAD_COUNT="unknown"
          PACKAGE_VERSION_ID="$(gh api "/${SCOPE}/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100" --jq ".[] | select(.metadata.container.tags[]? == \"${IMAGE_VERSION}\") | .id" | head -n 1 || true)"
          if [ -n "$PACKAGE_VERSION_ID" ]; then
            DOWNLOAD_COUNT="$(gh api "/${SCOPE}/${OWNER}/packages/container/${PACKAGE_NAME}/versions/${PACKAGE_VERSION_ID}" --jq '.download_count // .metadata.download_count // empty' || true)"
            if [ -z "$DOWNLOAD_COUNT" ]; then
              DOWNLOAD_COUNT="unknown"
            fi
          fi

          {
            echo "## Docker Images"
            echo ""
            echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`"
            echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`"
            echo "\`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev\` latest commit image for testing"
            echo ""
            echo "## Release Stats"
            echo ""
            echo "![Image downloads](echo "![GHCR downloads](https://img.shields.io/badge/GHCR%20downloads-${DOWNLOAD_COUNT}-blue?style=flat-square&logo=github)")"
            echo ""
            echo "## ${CHANGE_TITLE}"
            echo ""
            echo "${COMMITS}"
            echo ""
            echo "## Installation"
            echo ""
            echo "1. Copy \`.env.example\` to \`.env\` and update configuration"
            echo "2. Run: \`docker compose up -d\`"
            echo ""
            echo "See README.md for detailed setup instructions."
          } > RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag_version }}
          draft: ${{ inputs.draft }}
          body_path: RELEASE_NOTES.md
